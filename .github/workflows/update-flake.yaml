name: Update Flake Inputs

on:
  schedule:
    - cron: "0 4 * * *" # Run daily at 4 AM UTC
  workflow_dispatch:

jobs:
  update-and-build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Free disk space
        continue-on-error: true
        run: |
          sudo rm -rf /Applications/Xcode*
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            min-free = 5368709120  # 5GB
            max-free = 10737418240 # 10GB

      - name: Build current darwin configurations
        id: build-current
        continue-on-error: true
        run: |
          # Get list of darwin configurations
          configs=$(nix eval --json '.#darwinConfigurations' --apply 'builtins.attrNames')

          mkdir -p /tmp/old-configs
          # Parse JSON array and build each configuration
          echo "$configs" | jq -r '.[]' | while read -r config; do
            echo "Building current darwin configuration: $config"
            out_path=$(nix build ".#darwinConfigurations.\"$config\".system" --print-out-paths --no-link)
            echo "$out_path" > "/tmp/old-configs/$config"
          done

      - name: Update flake inputs
        id: update
        continue-on-error: true
        run: nix flake update

      - name: Build new darwin configurations and generate diff
        id: build
        if: steps.update.outcome == 'success'
        continue-on-error: true
        run: |
          configs=$(nix eval --json '.#darwinConfigurations' --apply 'builtins.attrNames')

          # Initialize PR body
          cat << 'EOF' > "$RUNNER_TEMP/pr-body.md"
          Automated pull request to update Nix flake inputs.

          All darwin configurations have been successfully built with the new inputs.

          ### Package Changes
          EOF

          echo "$configs" | jq -r '.[]' | while read -r config; do
            echo "Building new darwin configuration: $config"
            out_path=$(nix build ".#darwinConfigurations.\"$config\".system" --print-out-paths --no-link)
            
            if [ -f "/tmp/old-configs/$config" ]; then
              old_path=$(cat "/tmp/old-configs/$config")
              echo "Generating diff for $config..."
              
              echo "" >> "$RUNNER_TEMP/pr-body.md"
              echo "<details><summary><b>$config</b></summary>" >> "$RUNNER_TEMP/pr-body.md"
              echo "" >> "$RUNNER_TEMP/pr-body.md"
              echo "\`\`\`" >> "$RUNNER_TEMP/pr-body.md"
              nix run nixpkgs#nvd -- --color never diff "$old_path" "$out_path" >> "$RUNNER_TEMP/pr-body.md" || true
              echo "\`\`\`" >> "$RUNNER_TEMP/pr-body.md"
              echo "</details>" >> "$RUNNER_TEMP/pr-body.md"
            fi
          done

      - name: Create Pull Request
        if: steps.update.outcome == 'success' && steps.build.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: update-flake-lock
          delete-branch: true
